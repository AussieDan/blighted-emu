[package]
name = "content-tool"
version = "0.1.0"
description = "Builds generated table code, the content bundle and the world files from a New World client install, and checks capture ledgers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
crc32fast.workspace = true
hex.workspace = true
nw-ai.workspace = true
nw-capture.workspace = true
nw-carrier.workspace = true
nw-messages.workspace = true
nw-common.workspace = true
nw-content.workspace = true
nw-design.workspace = true
nw-formats.workspace = true
nw-oodle.workspace = true
nw-protocol.workspace = true
nw-reflect.workspace = true
nw-sim-core.workspace = true
nw-world.workspace = true
png.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
thiserror.workspace = true
# Capture archives are deflate zip files.
zip = { workspace = true, features = ["deflate-flate2"] }

[dev-dependencies]
nw-capture = { workspace = true, features = ["test-util"] }
# The in-sim replay of the retail mob fights (`ai_replay`).
sim = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[features]
# Tests that read the user's own New World install (set NW_GAME_DIR).
local-data = ["nw-formats/local-data", "nw-oodle/local-data", "ai-replay", "own-replay"]
# Replays of the retail capture through the AI runtime: they read
# local-data/captures/own/newchar-retail-2026-09-18/ledger.bin and the built
# local-data/content/ai-data-<build>.bin (run `content-tool ai-data` first).
ai-replay = []
# Replays of the retail tutorial captures' client input through the sim's own movement,
# against retail's own places: they read local-data/captures/own/newchar-*/ledger.bin and the
# built ftue_v2 world and collision files (run `just world` and `just collision` first).
own-replay = []

[lints]
workspace = true
