[package]
name = "sim"
version = "0.1.0"
description = "World simulation: one cell of a level, 30 Hz, movement checks and replication."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy_ecs.workspace = true
clap.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
nw-ai.workspace = true
nw-bus.workspace = true
nw-common.workspace = true
nw-content.workspace = true
nw-db.workspace = true
nw-formats.workspace = true
nw-login.workspace = true
nw-messages.workspace = true
nw-reflect.workspace = true
nw-sim-core.workspace = true
nw-social.workspace = true
nw-world.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
hex.workspace = true
nw-ai = { workspace = true, features = ["test-util"] }
nw-sim-core = { workspace = true, features = ["test-util"] }
nw-bus = { workspace = true, features = ["test-util"] }
nw-carrier.workspace = true
nw-content = { workspace = true, features = ["test-util"] }
nw-db = { workspace = true, features = ["test-util"] }

[features]
# `combat::test_support` and `mob_ai::test_support`: combat rows and a test AI for other
# crates' tests.
test-util = ["nw-ai/test-util"]
# Tests that need the Docker Compose NATS and PostgreSQL (`just test-infra`).
infra = []
# Tests that read the AI data file of local-data/content (run `content-tool ai-data` first).
local-data = []

[lints]
workspace = true
